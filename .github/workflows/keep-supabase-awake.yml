name: Keep Supabase awake

# Supabase mette in pausa i progetti free con poca attività nell'ultima settimana
# (docs: "tipicamente poche richieste al database AL GIORNO" bastano).
# 4 run al giorno x 3 query REST sulla tabella profiles (con la anon key la RLS
# restituisce una lista vuota: è comunque una query vera sul database).

on:
  schedule:
    - cron: "0 */6 * * *" # ogni 6 ore (00, 06, 12, 18 UTC)
  workflow_dispatch: {} # per testarlo a mano da Actions → Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (profiles)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Mancano i secrets SUPABASE_URL e/o SUPABASE_ANON_KEY"; exit 1
          fi
          for i in 1 2 3; do
            curl --fail -sS "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -w "\nHTTP %{http_code}\n"
            sleep 2
          done
